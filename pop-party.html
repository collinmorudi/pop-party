<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Party</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(145deg, #fff1a8, #ffc6e5 55%, #c9f8ff); color: #252044; display: grid; place-items: center; padding: 18px; }
    main { width: min(900px, 100%); text-align: center; }
    h1 { margin: 0 0 6px; font-size: clamp(2.2rem, 7vw, 4rem); letter-spacing: -.05em; }
    .subtitle { margin: 0 0 18px; color: #625b79; }
    .hud { display: flex; justify-content: center; gap: 12px; margin-bottom: 14px; }
    .pill { min-width: 112px; padding: 10px 18px; border-radius: 18px; background: #fff; box-shadow: 0 5px 0 #38265c18; font-weight: 800; }
    .pill span { display: block; font-size: .75rem; color: #77708d; text-transform: uppercase; letter-spacing: .08em; }
    .pill strong { font-size: 1.5rem; }
    #arena { height: min(55vh, 440px); min-height: 300px; position: relative; overflow: hidden; border: 4px solid #fff; border-radius: 26px; background: #ffffffa6; box-shadow: 0 14px 35px #49366b20; touch-action: manipulation; }
    .ball { position: absolute; width: clamp(48px, 9vw, 72px); aspect-ratio: 1; border: 0; border-radius: 50%; cursor: pointer; box-shadow: inset -8px -10px 0 #00000018, inset 5px 6px 0 #ffffff70, 0 8px 12px #35204b28; animation: pop-in .18s ease-out; transition: transform .12s; }
    .ball:hover { transform: scale(1.09); }
    .ball:active { transform: scale(.86); }
    .ball:focus-visible, button:focus-visible { outline: 4px solid #34225c; outline-offset: 3px; }
    @keyframes pop-in { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #message { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; padding: 20px; font-size: clamp(1.1rem, 3vw, 1.5rem); font-weight: 750; }
    #message[hidden] { display: none; }
    #message button { justify-self: center; min-height: 50px; padding: 10px 26px; border: 0; border-radius: 16px; color: white; background: #7546e8; font: inherit; cursor: pointer; box-shadow: 0 5px 0 #4c29a8; }
    .hint { margin: 12px 0 0; font-size: .9rem; color: #625b79; }
    @media (max-width: 480px) { body { padding: 12px; } .hud { gap: 8px; } .pill { min-width: 100px; padding: 8px 12px; } #arena { min-height: 320px; height: 58vh; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <h1>Pop Party 🎈</h1>
    <p class="subtitle">Catch the colourful balls before they vanish!</p>
    <div class="hud" aria-label="Game status">
      <div class="pill"><span>Score</span><strong id="score" aria-live="polite">0</strong></div>
      <div class="pill"><span>Time</span><strong id="time" aria-live="off">30</strong></div>
    </div>
    <section id="arena" aria-label="Game area">
      <div id="message" role="status"><span>Ready for a popping good time?</span><button id="start" type="button">Start game</button></div>
    </section>
    <p class="hint">Tap or click each ball to pop it. You have 30 seconds!</p>
  </main>
  <script>
    const arena = document.querySelector('#arena');
    const scoreDisplay = document.querySelector('#score');
    const timeDisplay = document.querySelector('#time');
    const message = document.querySelector('#message');
    const startButton = document.querySelector('#start');
    const colors = ['#ff4f7b', '#ff9f1c', '#ffe23b', '#28c76f', '#20c5e8', '#7955f5', '#ed55ce'];
    let score = 0;
    let seconds = 30;
    let timer = null;
    let playing = false;

    function spawnBall() {
      if (!playing) return;
      const ball = document.createElement('button');
      ball.type = 'button';
      ball.className = 'ball';
      ball.setAttribute('aria-label', 'Pop ball for one point');
      ball.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      const size = Math.min(72, Math.max(48, window.innerWidth * 0.09));
      const maxX = Math.max(0, arena.clientWidth - size);
      const maxY = Math.max(0, arena.clientHeight - size);
      ball.style.left = `${Math.random() * maxX}px`;
      ball.style.top = `${Math.random() * maxY}px`;
      ball.addEventListener('click', () => {
        if (!playing || !ball.isConnected) return;
        score++;
        scoreDisplay.textContent = score;
        ball.remove();
        spawnBall();
      }, { once: true });
      arena.append(ball);
    }

    function endGame() {
      playing = false;
      clearInterval(timer);
      arena.querySelectorAll('.ball').forEach(ball => ball.remove());
      message.innerHTML = `<span>Time's up! Final score: <strong>${score}</strong> 🎉</span><button id="restart" type="button">Play again</button>`;
      message.hidden = false;
      document.querySelector('#restart').addEventListener('click', startGame);
      console.log(`[Pop Party] Round ended — score: ${score}`);
    }

    function startGame() {
      clearInterval(timer);
      score = 0;
      seconds = 30;
      playing = true;
      scoreDisplay.textContent = score;
      timeDisplay.textContent = seconds;
      message.hidden = true;
      arena.querySelectorAll('.ball').forEach(ball => ball.remove());
      console.log('[Pop Party] Round started');
      spawnBall();
      timer = setInterval(() => {
        seconds--;
        timeDisplay.textContent = seconds;
        if (seconds <= 0) endGame();
      }, 1000);
    }

    startButton.addEventListener('click', startGame);
  </script>
</body>
</html>
